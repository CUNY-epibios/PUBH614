name: Beta Release for PR Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to create beta release for'
        required: true
        type: string

jobs:
  create-beta-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'
        use-public-rspm: true
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev pandoc
    
    - name: Install Quarto
      uses: quarto-dev/quarto-actions/setup@v1
      with:
        version: 'latest'
    
    - name: Install R dependencies
      run: |
        install.packages(c("pkgdown", "quarto", "tidyverse", "haven", "webr", "remotes"))
        remotes::install_deps(dependencies = TRUE)
      shell: Rscript {0}
    
    - name: Build package
      run: |
        # Build the R package
        R CMD build .
        PACKAGE_FILE=$(ls *.tar.gz | head -1)
        echo "PACKAGE_FILE=$PACKAGE_FILE" >> $GITHUB_ENV
        echo "Built package: $PACKAGE_FILE"
      shell: bash
    
    - name: Build pkgdown site
      run: |
        # Build the pkgdown site
        pkgdown::build_site()
        echo "Pkgdown site built successfully"
      shell: Rscript {0}
      env:
        GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create beta release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: beta-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}-${{ github.sha }}
        release_name: Beta Release - PR #${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        body: |
          ## 🧪 Beta Release for Testing
          
          **PR:** #${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          **Branch:** ${{ github.event.pull_request.head.ref || github.ref_name }}
          **Commit:** ${{ github.sha }}
          
          ### Changes in this PR:
          ${{ github.event.pull_request.body || 'See PR description for details' }}
          
          ### What's included:
          - ✅ R package built and validated
          - ✅ Pkgdown site generated
          - ✅ All Quarto documents rendered
          
          ### Testing Instructions:
          1. Download the `PUBH614_*.tar.gz` file below
          2. Install in R: `install.packages("PUBH614_*.tar.gz", repos = NULL, type = "source")`
          3. Test the functionality described in the PR
          4. Report any issues in the PR comments
          
          ### Preview Site:
          The pkgdown site has been built and is available as a download below. You can also view it by downloading and opening `docs/index.html` locally.
          
          ---
          **Note:** This is a beta release for testing purposes only. Do not use in production.
        draft: false
        prerelease: true
    
    - name: Upload package artifact
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.PACKAGE_FILE }}
        asset_name: ${{ env.PACKAGE_FILE }}
        asset_content_type: application/gzip
    
    - name: Upload pkgdown site
      run: |
        # Create a zip file of the pkgdown site
        cd docs
        zip -r ../pkgdown-site.zip .
        cd ..
        echo "PKGDOWN_ZIP=pkgdown-site.zip" >> $GITHUB_ENV
      shell: bash
    
    - name: Upload pkgdown site artifact
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.PKGDOWN_ZIP }}
        asset_name: pkgdown-site.zip
        asset_content_type: application/zip
    
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const releaseUrl = '${{ steps.create_release.outputs.html_url }}';
          const packageFile = '${{ env.PACKAGE_FILE }}';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🚀 Beta Release Created!
            
            A beta release has been created for testing this PR:
            
            **Release:** ${releaseUrl}
            **Package:** ${packageFile}
            
            ### Quick Test:
            1. Download the \`${packageFile}\` from the release
            2. Install: \`install.packages("${packageFile}", repos = NULL, type = "source")\`
            3. Test the changes and report any issues
            
            The pkgdown site is also available as a download for previewing the documentation changes.
            
            ---
            *This beta release will be automatically updated when you push new commits to this PR.*`
          });

  update-beta-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    
    steps:
    - name: Update existing beta release
      uses: actions/github-script@v7
      with:
        script: |
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          
          const betaRelease = releases.find(release => 
            release.tag_name.includes(`beta-pr-${context.issue.number}-`) && 
            release.prerelease === true
          );
          
          if (betaRelease) {
            // Update the release with new commit info
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: betaRelease.id,
              body: `## 🧪 Beta Release for Testing (Updated)
              
              **PR:** #${context.issue.number}
              **Branch:** ${context.payload.pull_request.head.ref}
              **Commit:** ${context.payload.pull_request.head.sha}
              **Updated:** ${new Date().toISOString()}
              
              ### Changes in this PR:
              ${context.payload.pull_request.body || 'See PR description for details'}
              
              ### What's included:
              - ✅ R package built and validated
              - ✅ Pkgdown site generated
              - ✅ All Quarto documents rendered
              
              ### Testing Instructions:
              1. Download the \`PUBH614_*.tar.gz\` file below
              2. Install in R: \`install.packages("PUBH614_*.tar.gz", repos = NULL, type = "source")\`
              3. Test the functionality described in the PR
              4. Report any issues in the PR comments
              
              ### Preview Site:
              The pkgdown site has been built and is available as a download below.
              
              ---
              **Note:** This is a beta release for testing purposes only. Do not use in production.
              **Last updated:** ${new Date().toISOString()}`
            });
            
            console.log(`Updated beta release: ${betaRelease.html_url}`);
          } else {
            console.log('No existing beta release found to update');
          }

  cleanup-old-beta-releases:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    
    steps:
    - name: Clean up old beta releases
      uses: actions/github-script@v7
      with:
        script: |
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          
          const betaReleases = releases.filter(release => 
            release.tag_name.includes(`beta-pr-${context.issue.number}-`) && 
            release.prerelease === true
          );
          
          for (const release of betaReleases) {
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id
            });
            console.log(`Deleted beta release: ${release.tag_name}`);
          }
          
          // Also delete the tags
          for (const release of betaReleases) {
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${release.tag_name}`
              });
              console.log(`Deleted tag: ${release.tag_name}`);
            } catch (error) {
              console.log(`Could not delete tag ${release.tag_name}: ${error.message}`);
            }
          }
