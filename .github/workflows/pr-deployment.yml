name: PR Deployment Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
    
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'
        use-public-rspm: true
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev pandoc
    
    - name: Install Quarto
      uses: quarto-dev/quarto-actions/setup@v1
      with:
        version: 'latest'
    
    - name: Install R dependencies
      run: |
        install.packages(c("pkgdown", "quarto", "tidyverse", "haven", "webr", "remotes"))
        remotes::install_deps(dependencies = TRUE)
      shell: Rscript {0}
    
    - name: Build pkgdown site
      run: |
        # Build the pkgdown site
        pkgdown::build_site()
        echo "Pkgdown site built successfully"
      shell: Rscript {0}
      env:
        GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Deploy to GitHub Pages (PR Preview)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        destination_dir: pr-${{ github.event.pull_request.number }}
        cname: cuny-epibios.github.io
    
    - name: Comment PR with preview link
      uses: actions/github-script@v7
      with:
        script: |
          const previewUrl = `https://cuny-epibios.github.io/PUBH614/pr-${context.issue.number}/`;
          
          // Check if we already commented
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });
          
          const existingComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('Preview site available')
          );
          
          if (existingComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id,
              body: `## 🌐 Preview Site Available!
              
              **Preview URL:** ${previewUrl}
              **PR:** #${context.issue.number}
              **Branch:** ${context.payload.pull_request.head.ref}
              **Commit:** ${context.payload.pull_request.head.sha}
              **Last updated:** ${new Date().toISOString()}
              
              ### What's included:
              - ✅ Complete pkgdown website
              - ✅ All Quarto documents rendered
              - ✅ Interactive R code execution (via webR)
              
              ### Testing the preview:
              1. Click the preview URL above
              2. Navigate through the different sections
              3. Test the interactive R code in the labs
              4. Check that all links work correctly
              5. Verify the documentation is up to date
              
              ---
              *This preview will be automatically updated when you push new commits to this PR.*`
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🌐 Preview Site Available!
              
              **Preview URL:** ${previewUrl}
              **PR:** #${context.issue.number}
              **Branch:** ${context.payload.pull_request.head.ref}
              **Commit:** ${context.payload.pull_request.head.sha}
              
              ### What's included:
              - ✅ Complete pkgdown website
              - ✅ All Quarto documents rendered
              - ✅ Interactive R code execution (via webR)
              
              ### Testing the preview:
              1. Click the preview URL above
              2. Navigate through the different sections
              3. Test the interactive R code in the labs
              4. Check that all links work correctly
              5. Verify the documentation is up to date
              
              ---
              *This preview will be automatically updated when you push new commits to this PR.*`
            });
          }

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    
    steps:
    - name: Clean up PR preview
      uses: actions/github-script@v7
      with:
        script: |
          // This would require additional setup to delete the preview site
          // For now, we'll just log that cleanup would happen
          console.log(`PR #${context.issue.number} closed - preview site cleanup would happen here`);
          console.log(`Preview URL was: https://cuny-epibios.github.io/PUBH614/pr-${context.issue.number}/`);
