name: Pkgdown Website Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-website:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'
        use-public-rspm: true
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev pandoc
    
    - name: Install Quarto
      uses: quarto-dev/quarto-actions/setup@v1
      with:
        version: 'latest'
    
    - name: Install R dependencies
      run: |
        install.packages(c("pkgdown", "quarto", "tidyverse", "haven", "webr"))
        remotes::install_deps(dependencies = TRUE)
      shell: Rscript {0}
    
    - name: Build pkgdown site
      run: |
        pkgdown::build_site()
      shell: Rscript {0}
      env:
        GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Check for build errors
      run: |
        if [ ! -d "docs" ]; then
          echo "ERROR: pkgdown build failed - docs directory not created"
          exit 1
        fi
        
        if [ ! -f "docs/index.html" ]; then
          echo "ERROR: pkgdown build failed - index.html not created"
          exit 1
        fi
        
        echo "Pkgdown build successful"
      shell: bash
    
    - name: Upload built site
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pkgdown-site
        path: docs/
        retention-days: 30

  deploy-website:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-website
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download built site
      uses: actions/download-artifact@v4
      with:
        name: pkgdown-site
        path: docs/
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        cname: cuny-epibios.github.io
