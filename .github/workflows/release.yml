name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major
        - prerelease

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'
        use-public-rspm: true
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev pandoc
    
    - name: Install Quarto
      uses: quarto-dev/quarto-actions/setup@v1
      with:
        version: 'latest'
    
    - name: Install R dependencies
      run: |
        install.packages(c("pkgdown", "quarto", "tidyverse", "haven", "webr", "remotes", "usethis"))
        remotes::install_deps(dependencies = TRUE)
      shell: Rscript {0}
    
    - name: Get version and create tag
      id: version
      run: |
        # Read current version from DESCRIPTION
        CURRENT_VERSION=$(grep "^Version:" DESCRIPTION | sed 's/Version: //')
        echo "Current version: $CURRENT_VERSION"
        
        # Determine release type
        if [ "${{ github.event.inputs.release_type }}" == "prerelease" ]; then
          NEW_VERSION="${CURRENT_VERSION}-$(date +%Y%m%d%H%M%S)"
          TAG_NAME="v${NEW_VERSION}"
          IS_PRERELEASE="true"
        else
          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          
          case "${{ github.event.inputs.release_type }}" in
            "major")
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            "minor")
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            "patch")
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG_NAME="v${NEW_VERSION}"
          IS_PRERELEASE="false"
        fi
        
        echo "New version: $NEW_VERSION"
        echo "Tag name: $TAG_NAME"
        echo "Is prerelease: $IS_PRERELEASE"
        
        # Update DESCRIPTION file
        sed -i "s/^Version: .*/Version: $NEW_VERSION/" DESCRIPTION
        
        # Set outputs
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
      shell: bash
    
    - name: Build package
      run: |
        # Build the R package
        R CMD build .
        PACKAGE_FILE=$(ls *.tar.gz | head -1)
        echo "PACKAGE_FILE=$PACKAGE_FILE" >> $GITHUB_ENV
        echo "Built package: $PACKAGE_FILE"
      shell: bash
    
    - name: Build pkgdown site
      run: |
        # Build the pkgdown site
        pkgdown::build_site()
        echo "Pkgdown site built successfully"
      shell: Rscript {0}
      env:
        GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Generate changelog
      id: changelog
      run: |
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          COMMITS=$(git log --oneline --pretty=format:"- %s (%h)" --no-merges)
        else
          COMMITS=$(git log ${LAST_TAG}..HEAD --oneline --pretty=format:"- %s (%h)" --no-merges)
        fi
        
        # Create changelog
        cat > CHANGELOG.md << EOF
        # Changelog
        
        ## [${{ steps.version.outputs.new_version }}] - $(date +%Y-%m-%d)
        
        ### Changes
        $COMMITS
        
        ### Full Changelog
        $([ -n "$LAST_TAG" ] && echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...${{ steps.version.outputs.tag_name }}" || echo "**Full Changelog**: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}")
        EOF
        
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat CHANGELOG.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      shell: bash
    
    - name: Create Git tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add DESCRIPTION
        git commit -m "Bump version to ${{ steps.version.outputs.new_version }}" || echo "No changes to commit"
        git tag -a "${{ steps.version.outputs.tag_name }}" -m "Release ${{ steps.version.outputs.tag_name }}"
        git push origin "${{ steps.version.outputs.tag_name }}"
      shell: bash
    
    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.tag_name }}
        release_name: Release ${{ steps.version.outputs.tag_name }}
        body: |
          ## 🎉 Release ${{ steps.version.outputs.tag_name }}
          
          ${{ steps.changelog.outputs.changelog }}
          
          ### 📦 Package Download
          Download the R package below to install locally:
          - `${{ env.PACKAGE_FILE }}` - Source package for R installation
          
          ### 🌐 Website
          The updated website is available at: https://cuny-epibios.github.io/PUBH614/
          
          ### 📋 Installation
          ```r
          # Install from source
          install.packages("${{ env.PACKAGE_FILE }}", repos = NULL, type = "source")
          
          # Or install from GitHub (if available)
          remotes::install_github("${{ github.repository }}")
          ```
          
          ### 🔧 What's New
          - Updated R package with latest changes
          - Refreshed pkgdown documentation
          - All Quarto labs updated and rendered
          - Interactive webR functionality available
          
          ---
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.version.outputs.tag_name }}...${{ steps.version.outputs.tag_name }}
        draft: false
        prerelease: ${{ steps.version.outputs.is_prerelease }}
    
    - name: Upload package artifact
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.PACKAGE_FILE }}
        asset_name: ${{ env.PACKAGE_FILE }}
        asset_content_type: application/gzip
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        cname: cuny-epibios.github.io
    
    - name: Update package version in repository
      run: |
        git push origin main
      shell: bash
