name: R Package Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['release', 'devel']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}
        use-public-rspm: true
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
    
    - name: Install R dependencies
      run: |
        install.packages(c("remotes", "rcmdcheck", "lintr"))
        remotes::install_deps(dependencies = TRUE)
      shell: Rscript {0}
    
    - name: Check package
      run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--no-vignettes"), error_on = "warning")
      shell: Rscript {0}
    
    - name: Upload check results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: r-check-results-${{ matrix.r-version }}
        path: check-results/

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'
        use-public-rspm: true
    
    - name: Install lintr
      run: install.packages("lintr")
      shell: Rscript {0}
    
    - name: Lint R files
      run: |
        lintr::lint_package()
      shell: Rscript {0}

  test-coverage:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'
        use-public-rspm: true
    
    - name: Install dependencies
      run: |
        install.packages(c("covr", "testthat"))
        remotes::install_deps(dependencies = TRUE)
      shell: Rscript {0}
    
    - name: Test coverage
      run: |
        covr::codecov()
      shell: Rscript {0}
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
